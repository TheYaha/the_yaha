<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Yaha — Эксклюзивы</title>
    <meta name="description" content="Эксклюзивные треки The Yaha. Слушайте онлайн или скачивайте.">
    <meta property="og:title" content="The Yaha — Эксклюзивы">
    <meta property="og:description" content="Эксклюзивные треки The Yaha в одном списке. Слушайте и скачивайте.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="images/og-cover.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <nav class="nav">
        <div class="nav-inner">
            <a href="index.html" class="logo">THE YAHA</a>
            <div class="nav-links">
                <a href="index.html#exclusive">← На главную</a>
            </div>
        </div>
    </nav>

    <section class="section section--centered player-page" style="padding-top: 140px; padding-bottom: 220px;">
        <div class="container">
            <p class="section-label section-label--center">Плеер</p>
            <h2 class="section-title section-title--center">Эксклюзивы</h2>
            <p class="section-desc section-desc--center">Только на сайте. Слушайте онлайн или скачивайте. Внимание: присутствует контент 18+.</p>

            <div class="player-toolbar" style="justify-content: center;">
                <input type="search" id="searchInput" class="player-search" placeholder="Поиск по названию…" autocomplete="off" aria-label="Поиск по названию" style="max-width: 420px; width: 100%;">
            </div>
            <p class="player-count" id="playerCount" aria-live="polite" style="text-align: center;"></p>

            <div class="track-list" id="trackList" aria-label="Список треков">
                <p class="track-list-empty" id="trackListEmpty">Загрузка списка…</p>
            </div>

            <div class="player-back">
                <a href="index.html#exclusive">← Вернуться на главную</a>
            </div>
        </div>
    </section>

    <div class="mini-player" id="miniPlayer" hidden>
        <div class="mini-player-inner">
            <button class="mini-cover" id="miniCoverBtn" aria-label="Развернуть плеер">
                <img id="miniCover" src="" alt="">
            </button>

            <div class="mini-info">
                <span class="mini-title" id="miniTitle">—</span>
                <span class="mini-meta" id="miniMeta">The Yaha</span>
            </div>

            <div class="mini-center">
                <div class="mini-controls">
                    <button class="mini-btn" id="miniPrev" aria-label="Предыдущий">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg>
                    </button>
                    <button class="mini-btn mini-btn--play" id="miniPlay" aria-label="Play">
                        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
                    </button>
                    <button class="mini-btn" id="miniNext" aria-label="Следующий">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
                    </button>
                </div>
                <div class="mini-progress">
                    <span class="mini-time" id="miniTimeCurrent">0:00</span>
                    <div class="mini-progress-track" id="miniProgress">
                        <div class="mini-progress-fill" id="miniFill"></div>
                    </div>
                    <span class="mini-time" id="miniTimeDuration">0:00</span>
                </div>
            </div>

            <div class="mini-right">
                <button class="mini-btn" id="miniVolumeBtn" aria-label="Звук">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 5 6 9H3v6h3l5 4z"/>
                        <path d="M16 9a4 4 0 0 1 0 6"/>
                        <path d="M19 6a8 8 0 0 1 0 12"/>
                    </svg>
                </button>
                <input type="range" id="volumeRange" class="mini-volume" min="0" max="1" step="0.01" value="1" aria-label="Громкость">
                <button class="mini-btn" id="miniExpand" aria-label="Развернуть на весь экран">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 14v6h6"/><path d="M20 10V4h-6"/><path d="M4 20l7-7"/><path d="M20 4l-7 7"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div class="full-player" id="fullPlayer" hidden>
        <div class="full-bg" id="fullBg"></div>

        <button class="full-close" id="fullClose" aria-label="Свернуть">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9l6 6 6-6"/>
            </svg>
        </button>

        <div class="full-content">
            <div class="full-cover-wrap">
                <img id="fullCover" class="full-cover" src="" alt="">
            </div>

            <h2 class="full-title" id="fullTitle">—</h2>
            <p class="full-meta" id="fullMeta">The Yaha</p>

            <div class="full-progress">
                <span class="full-time" id="fullTimeCurrent">0:00</span>
                <div class="full-progress-track" id="fullProgress">
                    <div class="full-progress-fill" id="fullFill"></div>
                </div>
                <span class="full-time" id="fullTimeDuration">0:00</span>
            </div>

            <div class="full-controls">
                <button class="full-btn" id="fullPrev" aria-label="Предыдущий">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg>
                </button>
                <button class="full-btn full-btn--play" id="fullPlay" aria-label="Play">
                    <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
                </button>
                <button class="full-btn" id="fullNext" aria-label="Следующий">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
                </button>
            </div>

            <div class="full-actions">
                <a class="full-download" id="fullDownload" href="#" download>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/>
                    </svg>
                    Скачать
                </a>
            </div>
        </div>
    </div>

    <script>
        const isAdultConfirmed = () => localStorage.getItem('yaha_adult') === 'yes';

        const state = {
            allTracks: [],
            visibleTracks: [],
            currentId: null,
            query: '',
            audio: new Audio()
        };

        const els = {
            list: document.getElementById('trackList'),
            listEmpty: document.getElementById('trackListEmpty'),
            searchInput: document.getElementById('searchInput'),
            count: document.getElementById('playerCount'),

            mini: document.getElementById('miniPlayer'),
            miniCover: document.getElementById('miniCover'),
            miniCoverBtn: document.getElementById('miniCoverBtn'),
            miniTitle: document.getElementById('miniTitle'),
            miniMeta: document.getElementById('miniMeta'),
            miniPlay: document.getElementById('miniPlay'),
            miniPrev: document.getElementById('miniPrev'),
            miniNext: document.getElementById('miniNext'),
            miniFill: document.getElementById('miniFill'),
            miniProgress: document.getElementById('miniProgress'),
            miniTimeCurrent: document.getElementById('miniTimeCurrent'),
            miniTimeDuration: document.getElementById('miniTimeDuration'),
            miniExpand: document.getElementById('miniExpand'),
            miniVolumeBtn: document.getElementById('miniVolumeBtn'),
            volumeRange: document.getElementById('volumeRange'),

            full: document.getElementById('fullPlayer'),
            fullClose: document.getElementById('fullClose'),
            fullBg: document.getElementById('fullBg'),
            fullCover: document.getElementById('fullCover'),
            fullTitle: document.getElementById('fullTitle'),
            fullMeta: document.getElementById('fullMeta'),
            fullPlay: document.getElementById('fullPlay'),
            fullPrev: document.getElementById('fullPrev'),
            fullNext: document.getElementById('fullNext'),
            fullProgress: document.getElementById('fullProgress'),
            fullFill: document.getElementById('fullFill'),
            fullTimeCurrent: document.getElementById('fullTimeCurrent'),
            fullTimeDuration: document.getElementById('fullTimeDuration'),
            fullDownload: document.getElementById('fullDownload')
        };

        const formatTime = (sec) => {
            if (isNaN(sec) || sec < 0) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        };

        const getTrack = (id) => state.allTracks.find(t => t.id === id) || null;

        function applyFilter() {
            const q = state.query.trim().toLowerCase();
            state.visibleTracks = state.allTracks.filter(t => !q || t.title.toLowerCase().includes(q));
        }

        function renderList() {
            els.list.innerHTML = '';
            els.count.textContent = state.query.trim() ? `Найдено: ${state.visibleTracks.length}` : '';

            if (!state.visibleTracks.length) {
                const p = document.createElement('p');
                p.className = 'track-list-empty';
                p.textContent = state.allTracks.length ? 'Ничего не найдено.' : 'Пока нет треков.';
                els.list.appendChild(p);
                return;
            }

            state.visibleTracks.forEach((track, index) => {
                const row = document.createElement('article');
                row.className = 'track-row';
                row.dataset.id = track.id;
                if (track.id === state.currentId) row.classList.add('is-active');
                if (!track.src) row.classList.add('is-unavailable');

                const newBadge = track.isNew ? '<span class="new-badge">Новое</span>' : '';
                const explicitBadge = track.explicit ? '<span class="explicit-badge">18+</span>' : '';
                const soonBadge = !track.src ? '<span class="track-badge-soon">Скоро</span>' : '';

                row.innerHTML = `
                    <span class="track-row-num">${String(index + 1).padStart(2, '0')}</span>
                    <div class="track-row-cover">
                        <img src="${track.cover}" alt="${track.title}" loading="lazy">
                        <button class="track-row-play" type="button" aria-label="Play" ${track.src ? '' : 'disabled'}>
                            <svg class="icon icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                            <svg class="icon icon-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
                        </button>
                    </div>
                    <div class="track-row-main">
                        <div class="track-row-top">
                            <span class="track-row-title">
                                ${track.title}
                                ${newBadge}
                                ${explicitBadge}
                                ${soonBadge}
                            </span>
                            <span class="track-row-meta">The Yaha · ${track.year || ''}</span>
                        </div>
                        <div class="track-row-progress">
                            <div class="track-row-progress-track" data-progress>
                                <div class="track-row-progress-fill" data-fill></div>
                            </div>
                            <span class="track-row-time" data-time>0:00</span>
                        </div>
                    </div>
                    <div class="track-row-actions">
                        ${
                            track.src
                                ? `<a class="icon-btn" href="${track.src}" download="${track.title}.mp3" aria-label="Скачать ${track.title}" title="Скачать">
                                       <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
                                   </a>`
                                : `<button class="icon-btn" disabled aria-label="Недоступно" title="Скоро"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg></button>`
                        }
                    </div>
                `;

                const playBtn = row.querySelector('.track-row-play');
                if (playBtn && track.src) playBtn.addEventListener('click', () => toggleTrack(track.id));

                const progressEl = row.querySelector('[data-progress]');
                if (progressEl && track.src) {
                    progressEl.addEventListener('click', (e) => {
                        if (state.currentId !== track.id || !state.audio.duration) return;
                        const rect = progressEl.getBoundingClientRect();
                        const pct = (e.clientX - rect.left) / rect.width;
                        state.audio.currentTime = pct * state.audio.duration;
                    });
                }

                els.list.appendChild(row);
            });

            updateAllUI();
        }

        function updateAllUI() {
            els.list.querySelectorAll('.track-row').forEach(row => {
                const id = row.dataset.id;
                const isCurrent = id === state.currentId;
                row.classList.toggle('is-active', isCurrent);
                row.classList.toggle('is-playing', isCurrent && !state.audio.paused);

                const fill = row.querySelector('[data-fill]');
                const time = row.querySelector('[data-time]');
                if (fill) {
                    if (isCurrent && state.audio.duration) {
                        fill.style.width = ((state.audio.currentTime / state.audio.duration) * 100) + '%';
                    } else if (!isCurrent) {
                        fill.style.width = '0%';
                    }
                }
                if (time) time.textContent = isCurrent ? formatTime(state.audio.currentTime) : '0:00';
            });

            if (els.mini && !els.mini.hidden) {
                els.mini.classList.toggle('is-playing', !state.audio.paused);
                els.miniPlay.classList.toggle('is-playing', !state.audio.paused);
                els.miniPlay.setAttribute('aria-label', state.audio.paused ? 'Play' : 'Pause');
                if (state.audio.duration) {
                    els.miniFill.style.width = ((state.audio.currentTime / state.audio.duration) * 100) + '%';
                    els.miniTimeCurrent.textContent = formatTime(state.audio.currentTime);
                    els.miniTimeDuration.textContent = formatTime(state.audio.duration);
                }
            }

            if (els.full && !els.full.hidden) {
                els.fullPlay.classList.toggle('is-playing', !state.audio.paused);
                els.fullPlay.setAttribute('aria-label', state.audio.paused ? 'Play' : 'Pause');
                if (state.audio.duration) {
                    els.fullFill.style.width = ((state.audio.currentTime / state.audio.duration) * 100) + '%';
                    els.fullTimeCurrent.textContent = formatTime(state.audio.currentTime);
                    els.fullTimeDuration.textContent = formatTime(state.audio.duration);
                }
            }
        }

        function updateTrackInfo(track) {
            if (!track) return;

            els.mini.hidden = false;
            els.miniCover.src = track.cover;
            els.miniCover.alt = track.title;
            els.miniTitle.textContent = track.title;
            els.miniMeta.textContent = `The Yaha · ${track.year || ''}`;

            els.fullCover.src = track.cover;
            els.fullCover.alt = track.title;
            els.fullTitle.textContent = track.title;
            els.fullMeta.textContent = `The Yaha · ${track.year || ''}`;
            els.fullBg.style.backgroundImage = `url("${track.cover}")`;

            if (track.src) {
                els.fullDownload.href = track.src;
                els.fullDownload.download = `${track.title}.mp3`;
                els.fullDownload.style.display = '';
            } else {
                els.fullDownload.style.display = 'none';
            }
        }

        function toggleTrack(id, opts = {}) {
            const { fromAuto = false } = opts;
            const track = getTrack(id);
            if (!track || !track.src) return;

            if (state.currentId !== id) {
                if (track.explicit && !isAdultConfirmed()) {
                    const ok = confirm('Трек содержит нецензурную лексику. Вам есть 18 лет?');
                    if (!ok) {
                        if (fromAuto) autoAdvanceFrom(id);
                        return;
                    }
                    localStorage.setItem('yaha_adult', 'yes');
                }
                state.currentId = id;
                state.audio.pause();
                state.audio.src = track.src;
                state.audio.load();
                updateTrackInfo(track);
                state.audio.play().catch(err => console.warn('Play failed:', err.name, err.message));
                updateAllUI();
                return;
            }

            if (state.audio.paused) state.audio.play().catch(err => console.warn(err));
            else state.audio.pause();
        }

        function autoAdvanceFrom(currentId) {
            if (!state.visibleTracks.length) return;
            const idx = state.visibleTracks.findIndex(t => t.id === currentId);
            const startIdx = idx === -1 ? 0 : idx;

            for (let step = 1; step <= state.visibleTracks.length; step++) {
                const next = state.visibleTracks[(startIdx + step) % state.visibleTracks.length];
                if (!next || !next.src || next.id === currentId) continue;
                toggleTrack(next.id, { fromAuto: true });
                return;
            }
        }

        function step(dir) {
            if (!state.visibleTracks.length) return;
            let idx = state.visibleTracks.findIndex(t => t.id === state.currentId);
            if (idx === -1) idx = 0;
            const next = (idx + dir + state.visibleTracks.length) % state.visibleTracks.length;
            const t = state.visibleTracks[next];
            if (t && t.src) toggleTrack(t.id);
        }

        state.audio.preload = 'metadata';
        state.audio.addEventListener('play', updateAllUI);
        state.audio.addEventListener('pause', updateAllUI);
        state.audio.addEventListener('timeupdate', updateAllUI);
        state.audio.addEventListener('loadedmetadata', updateAllUI);
        state.audio.addEventListener('ended', () => autoAdvanceFrom(state.currentId));
        state.audio.addEventListener('error', () => {
            const t = getTrack(state.currentId);
            console.error('Ошибка загрузки аудио:', t && t.src, state.audio.error);
        });

        els.miniPlay.addEventListener('click', () => {
            if (!state.currentId) return;
            const track = getTrack(state.currentId);
            if (track && track.explicit && !isAdultConfirmed() && state.audio.paused) {
                const ok = confirm('Трек содержит нецензурную лексику. Вам есть 18 лет?');
                if (!ok) return;
                localStorage.setItem('yaha_adult', 'yes');
            }
            if (state.audio.paused) state.audio.play().catch(err => console.warn(err));
            else state.audio.pause();
        });
        els.miniPrev.addEventListener('click', () => step(-1));
        els.miniNext.addEventListener('click', () => step(1));
        els.miniExpand.addEventListener('click', openFull);
        els.miniCoverBtn.addEventListener('click', openFull);

        els.miniProgress.addEventListener('click', (e) => {
            if (!state.audio.duration) return;
            const rect = els.miniProgress.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            state.audio.currentTime = pct * state.audio.duration;
        });

        els.volumeRange.addEventListener('input', (e) => {
            state.audio.volume = parseFloat(e.target.value);
        });
        els.miniVolumeBtn.addEventListener('click', () => {
            state.audio.muted = !state.audio.muted;
            els.miniVolumeBtn.classList.toggle('is-muted', state.audio.muted);
        });

        function openFull() {
            els.full.hidden = false;
            document.body.classList.add('full-player-open');
            updateAllUI();
        }
        function closeFull() {
            els.full.hidden = true;
            document.body.classList.remove('full-player-open');
        }

        els.fullClose.addEventListener('click', closeFull);
        els.fullPlay.addEventListener('click', () => {
            if (!state.currentId) return;
            const track = getTrack(state.currentId);
            if (track && track.explicit && !isAdultConfirmed() && state.audio.paused) {
                const ok = confirm('Трек содержит нецензурную лексику. Вам есть 18 лет?');
                if (!ok) return;
                localStorage.setItem('yaha_adult', 'yes');
            }
            if (state.audio.paused) state.audio.play().catch(err => console.warn(err));
            else state.audio.pause();
        });
        els.fullPrev.addEventListener('click', () => step(-1));
        els.fullNext.addEventListener('click', () => step(1));

        els.fullProgress.addEventListener('click', (e) => {
            if (!state.audio.duration) return;
            const rect = els.fullProgress.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            state.audio.currentTime = pct * state.audio.duration;
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !els.full.hidden) closeFull();
            if (e.code === 'Space' && !els.full.hidden) {
                e.preventDefault();
                els.fullPlay.click();
            }
        });

        let searchTimer = null;
        els.searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                state.query = e.target.value;
                applyFilter();
                renderList();
            }, 150);
        });

        async function loadTracks() {
            try {
                const res = await fetch('tracks.json', { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                if (!Array.isArray(data)) throw new Error('tracks.json должен быть массивом');

                state.allTracks = data;
                applyFilter();
                renderList();

                const params = new URLSearchParams(location.search);
                const key = params.get('track');
                if (key) {
                    const found = state.allTracks.find(t => t.id === key);
                    if (found && found.src) {
                        if (!state.visibleTracks.includes(found)) {
                            state.query = '';
                            els.searchInput.value = '';
                            applyFilter();
                            renderList();
                        }
                        toggleTrack(found.id);
                    }
                }
            } catch (err) {
                console.error('Не удалось загрузить tracks.json:', err);
                els.listEmpty.textContent = 'Не удалось загрузить список треков.';
            }
        }

        loadTracks();
    </script>
</body>
</html>
